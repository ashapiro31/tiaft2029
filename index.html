<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIAFT 2029 Vancouver</title>
<style>
:root{
--primary:#9f1d2c;
--accent:#d84a2f;
--dark:#13293d;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:#333;line-height:1.6;}
.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('images/wall_centre.jpg');
    background-size:cover;
    background-position:center;;
background-size:cover;background-position:center;
display:flex;align-items:center;justify-content:center;
text-align:center;color:white;
}
.hero-content{max-width:1000px;padding:20px;}
.logo{
    max-width:650px;
    width:90%;
    background:rgba(0,0,0,0.50);
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
}
.hero h1{font-size:4rem;letter-spacing:2px;}
.hero p{font-size:1.4rem;margin:15px 0;}
.btn{display:inline-block;background:var(--primary);color:white;padding:14px 30px;border-radius:30px;text-decoration:none;font-weight:bold;}
.gallery img{width:100%;height:260px;object-fit:cover;border-radius:12px;}
footer{background:var(--dark);color:white;text-align:center;padding:30px;}
</style>
</head>
<body>
<header class="hero">
<div class="hero-content">
<img src="images/logo_final.png" alt="TIAFT Vancouver 2029" class="logo">
<h1>TIAFT 2029</h1>
<p>The International Association of Forensic Toxicologists Annual Meeting</p>
<p><strong>4–8 November 2029 | Vancouver, British Columbia, Canada</strong></p>
<p>Sheraton Vancouver Wall Centre</p>
<!-- <a href="#venue" class="btn">Here's a useless button</a> -->
</div>
</header>
